  @font-face {

  @font-face {

    font-weight: 700;
  }
  @font-face {
    font-family: 'Montserrat';
    src: url('font://montserrat?weight=600&style=normal');
    font-weight: 600;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  #composition {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #000;
    overflow: hidden;
  }

  .clip {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
  }

  video.clip {
    object-fit: cover;
  }

  /* Chapter card styles */
  .chapter-card {
    position: absolute;
    left: 80px;
    bottom: 120px;
    background: rgba(0,0,0,0.65);
    border-left: 6px solid #F59E0B;
    padding: 18px 32px;
    opacity: 0;
    pointer-events: none;
  }

  .chapter-card .label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 22px;
    color: #F59E0B;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .chapter-card .title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 38px;
    color: #FFFFFF;
    line-height: 1.2;
  }

  /* Main title card */
  .title-card {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }

  .title-card .main-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 88px;
    color: #FFFFFF;
    text-align: center;
    line-height: 1.1;
    letter-spacing: -1px;
    text-shadow: 0 4px 32px rgba(0,0,0,0.8);
  }

  .title-card .main-title span {
    color: #F59E0B;
  }

  .title-card .subtitle {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 32px;
    color: rgba(255,255,255,0.8);
    text-align: center;
    margin-top: 24px;
    letter-spacing: 1px;
  }

  /* Subtitle / VO captions */
  .vo-subtitle {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    text-align: center;
    padding: 0 160px;
    opacity: 0;
    pointer-events: none;
  }

  .vo-subtitle span {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 30px;
    color: #FFFFFF;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    line-height: 1.5;
    display: inline;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  /* Dark overlay for transitions */
  .dark-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }

<script>
(function() {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};

  // Helper: fade in a clip at its data-start, fade out at end
  function addClip(id, start, dur, fadeIn, fadeOut) {
    fadeIn = fadeIn || 0.6;
    fadeOut = fadeOut || 0.6;
    tl.to('#' + id, { opacity: 1, duration: fadeIn, ease: 'power1.inOut' }, start);
    tl.to('#' + id, { opacity: 0, duration: fadeOut, ease: 'power1.inOut' }, start + dur - fadeOut);
  }

  // Video clips
